<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="زاد يتوقّع كمية الطعام التي يحتاجها فندقك أو مطعمك غداً في قطر، ليقلّ الهدر. Zad predicts tomorrow's food needs for hotels and restaurants in Qatar." />
    <meta name="theme-color" content="#ECE3D1" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Reem+Kufi:wght@600;700&display=swap" />
    <title>زاد · توقّع طعام الغد</title>
    <script>
      // Apply the remembered theme and language before first paint (no flash).
      try {
        var th = localStorage.getItem('zad-theme');
        if (!th) th = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = th;
        if (localStorage.getItem('zad-lang') === 'en') { document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr'; }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>زاد يحتاج JavaScript. Zad needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
