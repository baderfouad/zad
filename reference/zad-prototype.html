<title>Zad زاد</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400..700&family=Almarai:wght@300;400;700;800&display=swap">
<style>
/* Layout: Sadu-weave band under a quiet header; three views by hash (about / owner / kitchen).
   Owner = one calm column with very large type. Kitchen = dense two-column grid. The kitchen prep ticket is the one bold object. */
:root{
  --wool:#ECE3D1; --card:#F7F1E5; --ink:#2E1E15; --ink2:#6A5545; --line:#D6C7AD;
  --madder:#9C2B22; --saffron:#D48A1F; --saffron-soft:#F2D9A8; --palm:#4B6A37; --indigo:#34406A;
  --plate:#F7F1E5; --onDark:#F7F1E5;
  --good-soft:rgba(75,106,55,.13); --bad-soft:rgba(156,43,34,.11);
  --f-kufi:"Reem Kufi","Almarai",system-ui,sans-serif;
  --f-body:"Almarai","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --wool:#1E1611; --card:#291F18; --ink:#F1E6D3; --ink2:#BBA78E; --line:#46362A;
  --madder:#D95F50; --saffron:#EDAA45; --saffron-soft:#4A3517; --palm:#93B774; --indigo:#9AA8DA;
  --plate:#34281F; --onDark:#1E1611;
  --good-soft:rgba(147,183,116,.15); --bad-soft:rgba(217,95,80,.15); color-scheme:dark}}
:root[data-theme="dark"]{
  --wool:#1E1611; --card:#291F18; --ink:#F1E6D3; --ink2:#BBA78E; --line:#46362A;
  --madder:#D95F50; --saffron:#EDAA45; --saffron-soft:#4A3517; --palm:#93B774; --indigo:#9AA8DA;
  --plate:#34281F; --onDark:#1E1611;
  --good-soft:rgba(147,183,116,.15); --bad-soft:rgba(217,95,80,.15); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--wool);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--wool)}
h1,h2,h3{font-family:var(--f-kufi);font-weight:600;line-height:1.25;margin:0;text-wrap:balance}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--saffron);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Sadu weave band */
.sadu{height:18px;background:
  linear-gradient(135deg,var(--madder) 25%,transparent 25%) -9px 3px/18px 12px repeat-x,
  linear-gradient(225deg,var(--madder) 25%,transparent 25%) -9px 3px/18px 12px repeat-x,
  linear-gradient(315deg,var(--madder) 25%,transparent 25%) 0 3px/18px 12px repeat-x,
  linear-gradient(45deg,var(--madder) 25%,transparent 25%) 0 3px/18px 12px repeat-x,
  linear-gradient(var(--saffron) 0 3px,var(--ink) 3px 15px,var(--saffron) 15px)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--wool)}
.bar{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.logo{font-family:var(--f-kufi);font-weight:700;font-size:1.7rem;text-decoration:none;color:var(--ink);line-height:1;display:flex;align-items:center;gap:10px}
.logo svg{width:30px;height:30px}
.views{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.views a{text-decoration:none;padding:6px 16px;border-radius:999px;font-weight:700;font-size:.92rem;color:var(--ink2)}
.views a[aria-current="page"]{background:var(--ink);color:var(--wool)}
.bar .end{margin-inline-start:auto;display:flex;gap:10px;align-items:center}
.venue{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.9rem}
.langbtn{border:1px solid var(--ink);background:transparent;border-radius:999px;padding:6px 14px;font-weight:700;font-size:.88rem;cursor:pointer}
.langbtn:hover{background:var(--ink);color:var(--wool)}
@media (max-width:760px){.bar{gap:8px}.bar .end{margin-inline-start:0;width:100%;justify-content:space-between}.views{order:3;width:100%;justify-content:space-between}.views a{padding:6px 10px;flex:1;text-align:center}}

.demo-flag{font-size:.8rem;color:var(--ink2);padding-block:6px 0}

/* ---------- ABOUT ---------- */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center;padding-block:56px 40px}
.hero h1{font-size:clamp(2.3rem,5.6vw,4.3rem);font-weight:700;line-height:1.15}
.hero .sub{font-size:1.05rem;color:var(--ink2);margin-top:18px;max-width:52ch}
.hero .lead{font-size:1.15rem;margin-top:14px;max-width:52ch}
@media (max-width:880px){.hero{grid-template-columns:1fr;gap:36px;padding-block:36px 24px}}

/* prep ticket */
.ticket{background:var(--card);color:var(--ink);padding:26px 24px 28px;transform:rotate(-1.6deg);box-shadow:0 18px 40px -22px rgba(46,30,21,.55);position:relative;max-width:400px;justify-self:center;width:100%;
  -webkit-mask:radial-gradient(circle 7px at 50% 0,transparent 98%,#000) 0 0/18px 51% repeat-x,radial-gradient(circle 7px at 50% 100%,transparent 98%,#000) 0 100%/18px 51% repeat-x;
          mask:radial-gradient(circle 7px at 50% 0,transparent 98%,#000) 0 0/18px 51% repeat-x,radial-gradient(circle 7px at 50% 100%,transparent 98%,#000) 0 100%/18px 51% repeat-x}
[dir="rtl"] .ticket{transform:rotate(1.6deg)}
.ticket .tk-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;border-bottom:2px dashed var(--line);padding-bottom:12px}
.ticket .tk-head b{font-family:var(--f-kufi);font-size:1.25rem}
.ticket .tk-head span{font-size:.82rem;color:var(--ink2);text-align:end}
.tk-lines{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.tk-lines li{display:flex;gap:8px;align-items:baseline}
.tk-lines .dots{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px)}
.tk-lines .q{font-weight:800}
.tk-more{font-size:.85rem;color:var(--ink2);margin-top:6px}
.tk-total{margin-top:14px;border-top:2px dashed var(--line);padding-top:12px;display:flex;justify-content:space-between;align-items:baseline}
.tk-total b{font-family:var(--f-kufi);font-size:2rem;color:var(--madder)}
.tk-stamp{margin-top:12px;display:inline-block;border:2px solid var(--palm);color:var(--palm);font-weight:800;padding:4px 12px;border-radius:6px;transform:rotate(-3deg);font-size:.95rem}

.doors{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding-block:8px 64px}
.door{border-radius:18px;padding:30px;display:flex;flex-direction:column;gap:10px;text-decoration:none;min-width:0;transition:transform .2s}
.door:hover{transform:translateY(-3px)}
.door h2{font-size:1.6rem}
.door p{max-width:44ch}
.door .go{margin-top:auto;padding-top:14px;font-weight:800;text-decoration:underline;text-underline-offset:5px}
.door.owner{background:var(--saffron);color:#2E1E15}
.door.kitchen{background:var(--ink);color:var(--wool)}
.door svg{width:44px;height:44px}
@media (max-width:760px){.doors{grid-template-columns:1fr}}

.about-sec{padding-block:56px;border-top:1px solid var(--line)}
.about-sec h2{font-size:clamp(1.5rem,3vw,2.1rem);margin-bottom:26px}
.ps{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.ps h3{font-size:1.25rem}
.ps h3.bad{color:var(--madder)}
.ps h3.good{color:var(--palm)}
.ps p{margin-top:8px;font-size:1.08rem;max-width:50ch}
@media (max-width:760px){.ps{grid-template-columns:1fr;gap:24px}}
.seq{list-style:none;margin:0;padding:0;display:grid;gap:22px}
.seq.four{grid-template-columns:repeat(4,1fr)}
.seq.three{grid-template-columns:repeat(3,1fr)}
.seq li{min-width:0;border-top:3px solid var(--ink);padding-top:14px}
.seq .n{font-family:var(--f-kufi);font-size:2.2rem;font-weight:700;color:var(--saffron);line-height:1}
.seq h3{font-size:1.1rem;margin-top:8px}
.seq p{margin-top:6px;color:var(--ink2);font-size:.96rem}
@media (max-width:880px){.seq.four{grid-template-columns:1fr 1fr}.seq.three{grid-template-columns:1fr}}
@media (max-width:480px){.seq.four{grid-template-columns:1fr}}
.bens{display:grid;grid-template-columns:repeat(4,1fr);gap:26px}
.bens div{min-width:0}
.bens svg{width:30px;height:30px;color:var(--madder)}
.bens h3{font-size:1.1rem;margin-top:8px}
.bens p{color:var(--ink2);margin-top:4px;font-size:.96rem}
@media (max-width:880px){.bens{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.bens{grid-template-columns:1fr}}

/* ---------- OWNER ---------- */
.owner{max-width:860px;margin-inline:auto;padding-block:30px 70px;display:flex;flex-direction:column;gap:22px;font-size:1.08rem}
.o-hello{font-family:var(--f-kufi);font-size:1.25rem;color:var(--ink2)}
.o-answer{background:var(--card);border-radius:22px;padding:32px 30px;border:1px solid var(--line)}
.o-answer .when{font-weight:700;color:var(--ink2)}
.o-answer .cook{font-family:var(--f-kufi);font-size:clamp(1.5rem,3.4vw,2rem);margin-top:6px}
.o-answer .big{font-family:var(--f-kufi);font-weight:700;font-size:clamp(3.4rem,11vw,6.4rem);line-height:1;color:var(--madder);display:flex;align-items:baseline;gap:12px;margin-top:6px}
.o-answer .big small{font-size:.32em;color:var(--ink)}
.o-answer .why{margin-top:14px;font-size:1.15rem;max-width:46ch}
.o-answer .why b{color:var(--palm)}
.o-block{background:var(--card);border-radius:18px;padding:24px;border:1px solid var(--line)}
.o-block h2{font-size:1.35rem}
.o-block .hint{color:var(--ink2);margin-top:4px;font-size:.98rem}
.stepper{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.stepper button{width:58px;height:58px;border-radius:50%;border:2px solid var(--ink);background:transparent;font-size:1.6rem;font-weight:800;cursor:pointer;line-height:1}
.stepper button:hover{background:var(--ink);color:var(--wool)}
.stepper input{width:130px;height:58px;text-align:center;font-family:var(--f-kufi);font-size:2rem;font-weight:700;border:2px solid var(--line);border-radius:14px;background:var(--wool)}
.linkbtn{background:none;border:0;color:var(--madder);text-decoration:underline;text-underline-offset:4px;font-weight:700;cursor:pointer;padding:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.chip{border:2px solid var(--line);background:var(--wool);border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--wool);border-color:var(--ink)}
.tell{list-style:none;margin:14px 0 0;padding:0}
.tell li{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding-block:12px;border-bottom:1px dashed var(--line);align-items:baseline}
.tell li:last-child{border-bottom:0}
.tell .dn{font-weight:700;font-size:1.12rem}
.tell .svc{font-size:.85rem;color:var(--ink2);font-weight:400;margin-inline-start:8px}
.tell .kg{font-family:var(--f-kufi);font-size:1.5rem;font-weight:700;text-align:end}
.tell .was{grid-column:1/-1;font-size:.92rem;color:var(--ink2)}
.tell .was b{font-weight:700}
.tell .was .down{color:var(--palm)}
.tell .was .up{color:var(--madder)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:14px}
.tile{background:var(--wool);border-radius:14px;padding:18px;min-width:0}
.tile .l{font-size:.95rem;color:var(--ink2)}
.tile .v{font-family:var(--f-kufi);font-weight:700;font-size:2.2rem;line-height:1.15;margin-top:4px}
.tile .v small{font-size:.45em;font-weight:600;margin-inline-start:4px}
.tile .s{font-size:.9rem;color:var(--ink2)}
.tile.money .v{color:var(--palm)}
@media (max-width:640px){.tiles{grid-template-columns:1fr}}
.plates{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:16px}
.pl{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.pl .disc{width:100%;max-width:74px;aspect-ratio:1;border-radius:50%;border:3px solid var(--line);position:relative}
.pl .disc::after{content:"";position:absolute;inset:22%;border-radius:50%;border:1.5px solid var(--line);background:transparent}
.pl .d{font-size:.82rem;font-weight:700}
.pl .p{font-size:.82rem;color:var(--ink2)}
.compare{margin-top:14px;font-size:.98rem}
.compare b{color:var(--madder)}
.left-box{display:flex;flex-direction:column;gap:12px}
.bigbtn{align-self:flex-start;background:var(--palm);color:#fff;border:0;border-radius:14px;padding:16px 24px;font-weight:800;font-size:1.08rem;cursor:pointer}
.bigbtn:disabled{opacity:.4;cursor:not-allowed}
.sentnote{background:var(--good-soft);border-radius:12px;padding:14px 16px;font-size:.98rem;display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.ahead{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.ahead p{padding-inline-start:14px;border-inline-start:4px solid var(--saffron)}

/* ---------- KITCHEN ---------- */
.kitchen{padding-block:24px 70px;display:flex;flex-direction:column;gap:18px}
.k-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap}
.k-head h1{font-size:clamp(1.5rem,3vw,2rem)}
.k-head .for{color:var(--ink2);font-weight:700}
.scen{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:700;color:var(--ink2)}
.fld input,.fld select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-weight:700;color:var(--ink);font-size:.95rem}
.fld input[type=number]{width:96px}
.fld input[type=range]{accent-color:var(--saffron);width:140px;padding:0;border:0;background:transparent}
.fld .rv{display:flex;justify-content:space-between;gap:8px}
.fld .rv output{color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.kp{background:var(--card);padding:14px 16px;min-width:0}
.kp .l{font-size:.82rem;color:var(--ink2);font-weight:700}
.kp .v{font-family:var(--f-kufi);font-size:1.75rem;font-weight:700;line-height:1.2;margin-top:2px}
.kp .v small{font-size:.5em;font-weight:600;margin-inline-start:3px;color:var(--ink2)}
.kp .s{font-size:.8rem;color:var(--ink2)}
.kp .s .good{color:var(--palm);font-weight:700}
.kp .s .bad{color:var(--madder);font-weight:700}
@media (max-width:600px){.kpis{grid-template-columns:1fr}}
.pan{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.pan-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.pan-h h2{font-size:1.15rem}
.pan-h .s{font-size:.82rem;color:var(--ink2)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--wool);border-radius:8px;padding:5px 12px;font-weight:700;font-size:.85rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--wool);border-color:var(--ink)}
.note{font-size:.84rem;color:var(--ink2);margin-bottom:10px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem;min-width:560px}
th{text-align:start;font-size:.78rem;color:var(--ink2);font-weight:700;padding:6px 8px;border-bottom:2px solid var(--ink)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.dn{font-weight:700}
td.dn small{display:block;font-weight:400;color:var(--ink2);font-size:.78rem}
.st{display:inline-block;font-size:.78rem;padding:2px 8px;border-radius:6px;background:var(--wool);border:1px solid var(--line);white-space:nowrap}
.rng{position:relative;height:18px;min-width:150px}
.rng .tr{position:absolute;inset-inline:0;top:8px;height:2px;background:var(--line)}
.rng .band{position:absolute;top:4px;height:10px;background:var(--saffron-soft);border-radius:3px}
.rng .pt{position:absolute;top:2px;width:3px;height:14px;background:var(--madder);border-radius:2px}
.rng .us{position:absolute;top:1px;width:2px;height:16px;background:var(--ink2);opacity:.6}
.dl.good{color:var(--palm);font-weight:800}
.dl.bad{color:var(--madder);font-weight:800}
.bt{display:flex;gap:4px;flex-wrap:wrap}
.bt span{font-size:.78rem;background:var(--wool);border:1px solid var(--line);border-radius:6px;padding:2px 6px;white-space:nowrap}
.tot td{font-weight:800;border-bottom:0;border-top:2px solid var(--ink)}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media (max-width:960px){.kgrid{grid-template-columns:1fr}}
.chart svg{width:100%;height:auto;display:block}
.chart .ax{fill:var(--ink2);font-size:11px;font-family:var(--f-body)}
.chart .gl{stroke:var(--line)}
.chart .b0{fill:var(--madder)}
.chart .b1{fill:var(--palm)}
.chart .mk{stroke:var(--ink);stroke-dasharray:3 4}
.chart .mkl{fill:var(--ink);font-size:11px;font-weight:700;font-family:var(--f-body)}
.chart .la{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.chart .lf{fill:none;stroke:var(--saffron);stroke-width:2.2;stroke-dasharray:6 4;stroke-linejoin:round}
.chart .dt{fill:var(--ink)}
.lg{display:flex;gap:14px;font-size:.8rem;color:var(--ink2);flex-wrap:wrap}
.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-inline-end:5px}
.cats{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.cats .t{font-size:.85rem;font-weight:700;margin-bottom:8px}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden}
.stack i:nth-child(1){background:var(--madder)}
.stack i:nth-child(2){background:var(--saffron)}
.stack i:nth-child(3){background:var(--indigo)}
.cats .lg{margin-top:8px}
.drv{display:flex;flex-direction:column;gap:8px}
.dr{display:grid;grid-template-columns:9.5em 1fr 4em;gap:10px;align-items:center;font-size:.88rem}
.dr .tk{position:relative;height:16px;background:var(--wool);border-radius:4px}
.dr .sg{position:absolute;top:0;bottom:0;border-radius:4px}
.dr .v{text-align:end;font-weight:800}
.dr.base .sg{background:var(--ink2)}
.dr.pos .sg{background:var(--saffron)}
.dr.neg .sg{background:var(--indigo)}
.dr.total .sg{background:var(--madder)}
.dr.total{font-weight:800;border-top:1px solid var(--line);padding-top:8px}
.log table{min-width:520px}
.log input[type=number]{width:80px;background:var(--wool);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-weight:700}
.log input[type=checkbox]{width:18px;height:18px;accent-color:var(--palm)}
.logsum{display:flex;gap:24px;flex-wrap:wrap;margin-top:12px;align-items:flex-end}
.logsum div{font-size:.82rem;color:var(--ink2);font-weight:700}
.logsum b{display:block;font-family:var(--f-kufi);font-size:1.5rem;color:var(--ink)}
.logsum b.g{color:var(--palm)}
.rule{font-size:.82rem;color:var(--ink2);margin-top:10px;padding-inline-start:10px;border-inline-start:3px solid var(--palm)}
.kbtn{background:var(--palm);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer;margin-inline-start:auto}
.kbtn:disabled{opacity:.4;cursor:not-allowed}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:16px;align-items:end}
.wcol{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.wcol .n{font-family:var(--f-kufi);font-weight:700;font-size:1.05rem;line-height:1}
.wcol .r{font-size:.7rem;color:var(--ink2);white-space:nowrap}
.wcol .b{width:100%;max-width:56px;border-radius:8px 8px 3px 3px;background:var(--line)}
.wcol.tm .b{background:var(--saffron)}
.wcol.pk .b{background:var(--madder)}
.wcol .d{font-size:.82rem;font-weight:700;white-space:nowrap}

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const NOW=new Date();
const TODAY=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());
const TOMORROW=new Date(TODAY.getTime()+864e5);
const DAYS_AFTER=14;

// build history + today's leftovers per venue
const HIST={},STATE={};
for(const k in VENUES){
 const v=VENUES[k],r=rng(v.seed),G=v.dishes.reduce((a,d)=>a+d.g,0)/1000;
 const h=[];
 for(let i=0;i<28;i++){
  const date=new Date(TODAY.getTime()-(27-i)*864e5),dw=date.getDay();
  const actual=Math.round(v.base*v.dow[dw]*(1+(r()-.5)*.16));
  const eaten=actual*G*(1+(r()-.5)*.08);
  let fc=null,prep;
  if(i<28-DAYS_AFTER){prep=Math.max(actual*G*1.2,v.base*G*1.27)}
  else{fc=Math.round(actual*(1+(r()-.5)*.12));prep=fc*G*1.04}
  const waste=Math.max(prep-eaten,0)+eaten*.035;
  h.push({date,dw,actual,fc,prep,waste,pct:waste/prep});
 }
 HIST[k]=h;
 const tdw=TODAY.getDay();
 STATE[k]={guests:null,occ:"none",temp:29,sent:false,
  left:Object.fromEntries(v.dishes.map(d=>[d.id,Math.round(v.base*v.dow[tdw]*d.g/1000*(.03+r()*.07)*10)/10])),
  safe:Object.fromEntries(v.dishes.map(d=>[d.id,d.id!=="salad"]))};
}

const S={lang:"ar",venue:"hotel",view:"about",svc:"all"};
try{const l=localStorage.getItem("zad2-lang");if(l==="ar"||l==="en")S.lang=l;const vn=localStorage.getItem("zad2-venue");if(VENUES[vn])S.venue=vn}catch(e){}

const $=id=>document.getElementById(id);
const T=k=>L[S.lang][k];
const fill=(s,o)=>s.replace(/\{(\w+)\}/g,(_,k)=>o[k]);
const AR=()=>S.lang==="ar";
const nf=(n,d=0)=>new Intl.NumberFormat(AR()?"ar-QA-u-nu-arab":"en-US",{maximumFractionDigits:d,minimumFractionDigits:d}).format(n);
const pc=n=>nf(n)+(AR()?"٪":"%");
const digits=s=>AR()?String(s).replace(/\d/g,c=>"٠١٢٣٤٥٦٧٨٩"[c]):String(s);
const df=(d,o)=>d.toLocaleDateString(AR()?"ar-QA-u-ca-gregory-nu-arab":"en-GB",o);
const dname=d=>d[S.lang];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function model(k){
 const v=VENUES[k],st=STATE[k],O=OCC[st.occ],dw=TOMORROW.getDay();
 // driver chain for guests
 const hh=HIST[k],wdAvg=w=>{const xs=hh.filter(x=>x.dw===w);return xs.reduce((a,x)=>a+x.actual,0)/xs.length};
 const base=v.base,afterDow=wdAvg(dw),afterOcc=afterDow*O.g;
 let wxF=1;if(v.wx){wxF=st.temp>=38?1-(st.temp-37)*.012:(st.temp>=20&&st.temp<=30?1.03:1)}
 const afterWx=afterOcc*wxF,expected=Math.round(afterWx*v.trend);
 const drivers=[{k:"base",v:base},{k:"dow",v:afterDow-base},{k:"occ",v:afterOcc-afterDow},{k:"wx",v:afterWx-afterOcc},{k:"tr",v:expected-afterWx},{k:"tot",v:expected}];
 const guests=st.guests==null?expected:st.guests;
 const unc=.07+(st.occ!=="none"?.05:0)+(st.guests!=null?.01:0);
 const rows=v.dishes.map(d=>{
  const mix=(O.mix[d.id]||1)*(st.occ==="ramadan"&&d.s==="bf"?O.bf:1);
  let w=1;if(st.temp>=38&&HEAVY.includes(d.id))w=.85;if(st.temp>=38&&LIGHT.includes(d.id))w=1.2;
  const fc=guests*d.g/1000*O.eat*mix*w;
  const usual=base*O.g*d.g/1000*O.over*mix;
  const u=unc+(d.st==="grill"?.02:0);
  return {d,fc,usual,lo:fc*(1-u),hi:fc*(1+u)};
 });
 const tot=rows.reduce((a,r)=>a+r.fc,0),usual=rows.reduce((a,r)=>a+r.usual,0);
 const saveKg=rows.reduce((a,r)=>a+Math.max(0,r.usual-r.fc),0);
 const saveQ=rows.reduce((a,r)=>a+Math.max(0,r.usual-r.fc)*r.d.c,0);
 // history stats
 const h=HIST[k],cut=28-DAYS_AFTER,bef=h.slice(0,cut),aft=h.slice(cut);
 const avgBefKg=bef.reduce((a,x)=>a+x.waste,0)/bef.length,avgBefPct=bef.reduce((a,x)=>a+x.pct,0)/bef.length;
 const last7=h.slice(21),pct7=last7.reduce((a,x)=>a+x.pct,0)/7;
 const savedKg=aft.reduce((a,x)=>a+(avgBefKg-x.waste),0);
 const avgCost=v.dishes.reduce((a,d)=>a+d.g*d.c,0)/v.dishes.reduce((a,d)=>a+d.g,0);
 const mape=aft.reduce((a,x)=>a+Math.abs(x.fc-x.actual)/x.actual,0)/aft.length;
 const sharedMeals=aft.reduce((a,x)=>a+x.waste*.38,0)/.45;
 const leftTot=v.dishes.reduce((a,d)=>a+(+st.left[d.id]||0),0);
 const leftSafe=v.dishes.reduce((a,d)=>a+(st.safe[d.id]?(+st.left[d.id]||0):0),0);
 const week=[];for(let i=1;i<=7;i++){const date=new Date(TODAY.getTime()+i*864e5);const g=i===1?expected:Math.round(wdAvg(date.getDay())*v.trend);week.push({date,g,lo:Math.round(g*(1-unc)),hi:Math.round(g*(1+unc))})}
 return {week,v,st,O,expected,guests,unc,drivers,rows,tot,usual,saveKg,saveQ,h,aft,avgBefPct,pct7,savedKg,avgCost,acc:1-mape,sharedMeals,leftTot,leftSafe};
}

}

function renderAbout(M){

 const top=M.rows.slice().sort((a,b)=>b.fc-a.fc),show=top.slice(0,6);
 $("tkLines").innerHTML=show.map(r=>`<li><span>${esc(dname(r.d))}</span><span class="dots"></span><span class="q num">${nf(r.fc,1)} ${T("kg")}</span></li>`).join("");

 const diff=M.usual-M.tot;
 $("tkStamp").textContent=diff>=1?fill(T("tk_less"),{kg:nf(diff)}):fill(T("tk_more_kg"),{kg:nf(-diff)});
}

function renderOwner(M){
 const hr=NOW.getHours();
 $("oHello").textContent=(hr<12?T("morning"):T("evening"))+"، "+dname(M.v.name).split(/[,،]/)[0];
 if(!AR())$("oHello").textContent=(hr<12?T("morning"):T("evening"))+", "+dname(M.v.name).split(",")[0];
 $("oWhen").textContent=fill(T("o_when"),{d:df(TOMORROW,{weekday:"long",day:"numeric",month:"long"})});
 $("oBig").textContent=nf(M.tot);
 const diff=M.usual-M.tot;
 $("oWhy").innerHTML=diff>=1?fill(T("o_less"),{kg:nf(diff),qar:nf(Math.round(M.saveQ/10)*10)}):fill(T("o_more"),{kg:nf(-diff)});
 const gi=$("o-guests");if(document.activeElement!==gi)gi.value=M.guests;
 $("oGHint").textContent=fill(M.st.guests==null?T("o_g_hint"):T("o_g_hint_own"),{n:nf(M.expected)});
 $("oReset").hidden=M.st.guests==null;
 $("oOcc").innerHTML=Object.keys(OCC).map(k=>`<button type="button" class="chip" data-occ="${k}" aria-pressed="${M.st.occ===k}">${T("occ")[k]}</button>`).join("");
 $("oTell").innerHTML=M.rows.map(r=>{
  const d=r.usual-r.fc,ab=Math.abs(d);
  const was=ab<.5?T("o_was_same"):fill(d>0?T("o_was_down"):T("o_was_up"),{kg:nf(r.usual,1),d:nf(ab,1)+" "+T("kg")});
  const svc=M.v.kind==="buffet"?`<span class="svc">${T("svc")[r.d.s]}</span>`:"";
  return `<li><span class="dn">${esc(dname(r.d))}${svc}</span><span class="kg num">${nf(r.fc,1)} ${T("kg")}</span><span class="was">${was}</span></li>`}).join("");
 $("oSinceH").textContent=fill(T("o_since"),{n:nf(DAYS_AFTER)});
 $("tMoney").textContent=nf(Math.round(M.savedKg*M.avgCost/10)*10);
 $("tFood").textContent=nf(M.savedKg);
 $("tFoodS").textContent=fill(T("t_food_s"),{n:nf(Math.round(M.savedKg/.45/10)*10)});
 $("oLeftP").textContent=M.leftSafe>0?fill(T("o_left_p"),{kg:nf(M.leftSafe,1),m:nf(Math.floor(M.leftSafe/.45))}):T("o_left_none");
 sentUI("o",M);
}

function sentUI(p,M){
 $(p+"Send").disabled=M.leftSafe<=0||M.st.sent;
 $(p+"Send").hidden=M.st.sent;
 $(p+"Sent").hidden=!M.st.sent;
 if(M.st.sent)$(p+"SentT").textContent=fill(T("sent"),{kg:nf(M.st.sentKg,1)});
}

/* ---------- kitchen ---------- */
function renderKitchen(M){
 $("kTitle").textContent=fill(T("k_title"),{v:dname(M.v.name).split(/[,،]/)[0]});
 $("kFor").textContent=fill(T("k_for"),{d:df(TOMORROW,{weekday:"long",day:"numeric",month:"long"})});
 const kg=$("k-guests");if(document.activeElement!==kg)kg.value=M.guests;
 $("k-occ").value=M.st.occ;
 $("biG").textContent=nf(M.guests);
 $("biGS").textContent=fill(T("kp_g_s"),{a:nf(Math.round(M.guests*(1-M.unc))),b:nf(Math.round(M.guests*(1+M.unc)))});
 const diff=M.tot-M.usual;
 $("biP").innerHTML=nf(M.tot)+`<small>${T("kg")}</small>`;
 $("biPS").textContent=fill(T("kp_prep_s"),{d:(diff<=0?"−":"+")+nf(Math.abs(diff))+" "+T("kg")});
 $("biW").textContent=pc(Math.round(M.pct7*100));
 $("biWS").textContent=fill(T("kp_w_s"),{p:pc(Math.round(M.avgBefPct*100))});
 $("biS").textContent=nf(Math.round(M.savedKg*M.avgCost/10)*10);
 $("biAcc").textContent=pc(Math.round(M.acc*100));
 $("biLeft").textContent=nf(M.leftSafe,1);
 // prep by dish
 const mx=Math.max(...M.rows.map(r=>Math.max(r.fc,r.usual)));
 $("biDish").innerHTML=M.rows.slice().sort((a,b)=>b.fc-a.fc).map(r=>`<div class="hr"><span>${esc(dname(r.d))}</span><div class="bars"><i class="z" style="width:${r.fc/mx*100}%"></i><i class="u" style="width:${r.usual/mx*100}%"></i></div><span class="v num">${nf(r.fc,1)}</span></div>`).join("");
 // funnel
 const cooked=M.aft.reduce((a,x)=>a+x.prep,0),waste=M.aft.reduce((a,x)=>a+x.waste,0),eaten=cooked-waste,don=waste*.38;
 const st=[["fn_cook",cooked,""],["fn_eat",eaten,""],["fn_waste",waste,"w"],["fn_don",don,"d"]];
 $("biFun").innerHTML=st.map(([k,v,c])=>`<div class="fl"><span>${T(k)}</span><b class="num">${nf(v)} ${T("kg")} (${pc(Math.round(v/cooked*100))})</b></div><div class="f ${c}" style="width:${Math.max(v/cooked*100,4)}%"></div>`).join("");
 // pie
 const c=M.v.kind==="buffet"?[58,27,15]:[46,38,16],cl=[M.v.kind==="buffet"?T("cat1_b"):T("cat1_a"),T("cat2"),T("cat3")],cc=["var(--madder)","var(--saffron)","var(--indigo)"];
 let a0=-Math.PI/2,paths="";
 c.forEach((v,i)=>{const a1=a0+v/100*2*Math.PI,l=v>50?1:0,x0=50+48*Math.cos(a0),y0=50+48*Math.sin(a0),x1=50+48*Math.cos(a1),y1=50+48*Math.sin(a1);
  paths+=`<path d="M50 50 L${x0} ${y0} A48 48 0 ${l} 1 ${x1} ${y1}Z" fill="${cc[i]}" stroke="var(--card)" stroke-width="1.5"/>`;a0=a1});
 $("biPie").innerHTML=`<svg viewBox="0 0 100 100" role="img" aria-label="${esc(T("bi_pie"))}">${paths}</svg><div class="lg">${c.map((v,i)=>`<span><i style="background:${cc[i]}"></i>${cl[i]} ${pc(v)}</span>`).join("")}</div>`;
 wasteChart(M);
 sentUI("k",M);
}

function wasteChart(M){
 const h=M.h,W=560,H=220,Lp=42,R=10,Tp=20,B=28,cut=28-DAYS_AFTER;
 const mxv=Math.max(...h.map(x=>x.waste)),step=mxv>60?20:mxv>30?10:5,ym=Math.ceil(mxv*1.1/step)*step;
 const bw=(W-Lp-R)/28,y=v=>Tp+(1-v/ym)*(H-Tp-B);
 let g="";
 for(let v=0;v<=ym;v+=step)g+=`<line class="gl" x1="${Lp}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${Lp-6}" y="${y(v)+4}" text-anchor="end">${nf(v)}</text>`;
 h.forEach((x,i)=>{const X=Lp+i*bw+bw*.15;g+=`<rect class="${i<cut?"b0":"b1"}" x="${X}" y="${y(x.waste)}" width="${bw*.7}" height="${y(0)-y(x.waste)}" rx="2"/>`;
  if(i%7===0||i===27)g+=`<text class="ax" x="${X+bw*.35}" y="${H-8}" text-anchor="middle">${esc(df(x.date,{day:"numeric",month:"numeric"}))}</text>`});
 const mx=Lp+cut*bw;
 g+=`<line class="mk" x1="${mx}" x2="${mx}" y1="${Tp-6}" y2="${y(0)}"/><text class="mkl" x="${mx+5}" y="${Tp+4}">${esc(T("zad_on"))}</text>`;
 $("kWaste").innerHTML=`<svg viewBox="0 0 ${W} ${H}" dir="ltr" role="img" aria-label="${esc(T("w_h"))}">${g}</svg>`;
}
function accChart(M){
 const a=M.aft,W=480,H=220,Lp=40,R=12,Tp=14,B=28;
 const vals=a.flatMap(x=>[x.actual,x.fc]),lo=Math.floor(Math.min(...vals)*.9/10)*10,hi=Math.ceil(Math.max(...vals)*1.05/10)*10;
 const step=(hi-lo)>150?50:(hi-lo)>60?20:10;
 const x=i=>Lp+i*(W-Lp-R)/(a.length-1),y=v=>Tp+(1-(v-lo)/(hi-lo))*(H-Tp-B);
 let g="";
 for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step)g+=`<line class="gl" x1="${Lp}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${Lp-6}" y="${y(v)+4}" text-anchor="end">${nf(v)}</text>`;
 a.forEach((p,i)=>{if(i%3===0||i===a.length-1)g+=`<text class="ax" x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(df(p.date,{day:"numeric",month:"numeric"}))}</text>`});
 g+=`<polyline class="la" points="${a.map((p,i)=>x(i)+","+y(p.actual)).join(" ")}"/>`;
 g+=`<polyline class="lf" points="${a.map((p,i)=>x(i)+","+y(p.fc)).join(" ")}"/>`;
 a.forEach((p,i)=>g+=`<circle class="dt" cx="${x(i)}" cy="${y(p.actual)}" r="2.6"/>`);
 $("kAcc").innerHTML=`<svg viewBox="0 0 ${W} ${H}" dir="ltr" role="img" aria-label="${esc(T("acc_h"))}">${g}</svg>`;
}
function drivers(M){
 const ds=M.drivers,mx=Math.max(...ds.map(d=>d.k==="base"||d.k==="tot"?d.v:0),ds.reduce((a,d)=>d.k==="tot"?a:a+Math.max(0,d.v),0))*1.05;
 const side=AR()?"right":"left";let cum=0;
 const label={base:T("dr_base"),dow:fill(T("dr_dow"),{d:df(TOMORROW,{weekday:"long"})}),occ:T("dr_occ"),wx:T("dr_wx"),tr:T("dr_tr"),tot:T("dr_tot")};
 $("kDrv").innerHTML=ds.map(d=>{
  let start,width,cls;
  if(d.k==="base"){start=0;width=d.v;cum=d.v;cls="base"}
  else if(d.k==="tot"){start=0;width=d.v;cls="total"}
  else{start=d.v>=0?cum:cum+d.v;width=Math.abs(d.v);cum+=d.v;cls=d.v>=0?"pos":"neg"}
  const val=d.k==="base"||d.k==="tot"?nf(Math.round(d.v)):(Math.round(d.v)>=0?"+":"−")+nf(Math.abs(Math.round(d.v)));
  return `<div class="dr ${cls}"><span>${esc(label[d.k])}</span><div class="tk"><div class="sg" style="${side}:${start/mx*100}%;width:${Math.max(width/mx*100,.6)}%"></div></div><span class="v num">${val}</span></div>`}).join("");
}

function renderWeek(M,id,pid){
 const mx=Math.max(...M.week.map(w=>w.g)),mn=Math.min(...M.week.map(w=>w.g))*.8,pk=M.week.reduce((a,w)=>w.g>a.g?w:a,M.week[0]);
 $(id).innerHTML=M.week.map((w,i)=>{const cls=(i===0?" tm":"")+(w===pk?" pk":"");
  return `<div class="wcol${cls}"><span class="n num">${nf(w.g)}</span><span class="r num">${nf(w.lo)}–${nf(w.hi)}</span><div class="b" style="height:${Math.round(24+(w.g-mn)/(mx-mn)*96)}px"></div><span class="d">${esc(df(w.date,{weekday:"short"}))}</span><span class="t">${i===0?T("wk_tm"):esc(df(w.date,{day:"numeric",month:"numeric"}))}</span></div>`}).join("");
 $(pid).innerHTML=fill(T("wk_peak"),{d:esc(df(pk.date,{weekday:"long"})),n:nf(pk.g)});
}
/* ---------- routing + render ---------- */
function render(keepLog){
 const M=model(S.venue);
 renderAbout(M);renderOwner(M);renderKitchen(M);renderWeek(M,"oWeek","oPeak");renderWeek(M,"kWeek","kPeak");
}
function route(){
 const h=location.hash.replace("#","");S.view=["about","owner","kitchen"].includes(h)?h:"about";
 ["about","owner","kitchen"].forEach(v=>$("v-"+v).hidden=v!==S.view);
 document.querySelectorAll(".views a").forEach(a=>{if(a.dataset.v===S.view)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
 window.scrollTo(0,0);
}

/* ---------- events ---------- */
const st=()=>STATE[S.venue];
function setGuests(n){n=Math.max(10,Math.min(2000,Math.round(n)||0));st().guests=n;render(true)}
$("oMinus").addEventListener("click",()=>{const M=model(S.venue);setGuests(M.guests-10)});
$("oPlus").addEventListener("click",()=>{const M=model(S.venue);setGuests(M.guests+10)});
$("o-guests").addEventListener("change",e=>setGuests(+e.target.value));
$("k-guests").addEventListener("change",e=>setGuests(+e.target.value));
$("oReset").addEventListener("click",()=>{st().guests=null;render(true)});
$("oOcc").addEventListener("click",e=>{const b=e.target.closest("[data-occ]");if(!b)return;st().occ=b.dataset.occ;st().guests=null;render(true)});
$("k-occ").addEventListener("change",e=>{st().occ=e.target.value;st().guests=null;render(true)});
function send(){const M=model(S.venue);if(M.leftSafe<=0)return;st().sent=true;st().sentKg=M.leftSafe;render(true)}
$("oSend").addEventListener("click",send);$("kSend").addEventListener("click",send);
document.addEventListener("click",e=>{if(e.target.closest("[data-undo]")){st().sent=false;render(true)}});
$("venueSel").addEventListener("change",e=>{S.venue=e.target.value;S.svc="all";try{localStorage.setItem("zad2-venue",S.venue)}catch(_){}render(false)});
$("langBtn").addEventListener("click",()=>{S.lang=AR()?"en":"ar";try{localStorage.setItem("zad2-lang",S.lang)}catch(_){}applyText();render(false)});
window.addEventListener("hashchange",route);

applyText();render(false);route();
})();
</script>
